{% extends "posts/base.html" %}
{% load static %}

{% block content %}
<div class="post-detail-container">
    {% if post %}
    <div class="post-detail-wrapper">
        <!-- Left side: Post Image -->
        <div class="post-detail-left">
            <div class="post-image-wrapper">
                <img src="{{ post.image.url }}" alt="{{ post.title }}" class="post-main-image">
            </div>
        </div>

        <!-- Right side: User Info and Actions -->
        <div class="post-detail-right">
            <div class="image-name post-detail-righ-image-name">
                <a href="{% url 'profile' post.user.username %}">
                    <img src="{{ post.user.profile.image.url }}" alt="">
                </a>
                <a href="{% url 'profile' post.user.username %}" style="text-decoration: none; color: inherit;">
                    <p>{{ post.user.username }}</p>
                </a>
            </div>

            <div class="post-content-section">
                <h2 class="post-title">{{ post.title }}</h2>
                <p class="post-content-text">{{ post.content }}</p>
            </div>

            <!-- Only show actions if the logged-in user is the post owner -->
            {% if request.user == post.user %}
            <div class="post-actions">
                <a href="" class="btn btn-update">Update</a>
                
                <!-- Delete Form -->
                <form method="POST" action="{% url 'post-delete' username=post.user.username post_id=post.id %}" style="display: inline;">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-delete" onclick="return confirm('Are you sure you want to delete this post?');">Delete</button>
                </form>
            </div>
            {% endif %}
        </div>
    </div>
    {% endif %}
</div>
{% endblock %}
