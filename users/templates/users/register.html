{% extends "posts/base.html" %}
{% load static %}

{% block content %}
<div class="register-container">
    <div class="register-card">
        <h1 class="register-title">Join Today!!</h1>

        <form method="POST" class="register-form">
            {% csrf_token %}

            {% for field in form %}
                <div class="form-group">

                    {{ field.label_tag }}
                    {{ field }}

                    <!-- ← Add this to show help text -->
                    <!-- {% if field.help_text %}           
                        <small class="help-text">{{ field.help_text }}</small>
                    {% endif %}  -->

                    {% if field.errors %}
                    <div class="error">
                        {{ field.errors }}
                    </div>
                    {% endif %}

                </div>
            {% endfor %}

            <button type="submit" class="btn">
                Register
            </button>
            <div>
                <p>Already Have An Account? <a href="{% url 'login' %}">Sign In</a></p>
            </div>
        </form>
    </div>
</div>
{% endblock content %}
